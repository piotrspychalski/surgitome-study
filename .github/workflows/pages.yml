# Składanie, testy i publikacja SURGITOME-STUDY na GitHub Pages przy każdej zmianie w gałęzi main (sha commitu trafia do odpowiedzi: GITHUB_SHA)
name: SURGITOME-STUDY — build, testy, publikacja
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node build.js && cp dist/surgitome.html dist/index.html
      - name: Testy szybkie (tłumaczenia, kolizje, interfejs, wyszukiwarka, ulubione, TK, informacja startowa, samouczek, badania, wątroba, statystyki zabiegów, cytowanie, kod QR na telefonie, krezka lewostronna, piśmiennictwo; SURGITOME-STUDY — dostęp, ankieta, telefon, analiza)
        run: |
          node tests/i18n.js
          node tests/kolizje_animacji.js | tail -1 | grep -q ': 0' 
          for t in tests/ui_18.js tests/ui_19.js tests/ui_26.js tests/ui_27.js tests/ui_28.js tests/ui_29.js tests/ui_30.js tests/ui_31.js tests/ui_32.js tests/ui_33.js tests/ui_34.js tests/ui_35.js tests/ui_36.js tests/ui_37.js tests/ui_38.js tests/ui_39.js tests/ui_40.js tests/ui_41.js tests/ui_43.js tests/ui_44.js tests/ui_42.js tests/ui_50.js tests/ui_51.js tests/ui_52.js; do node "$t" | tail -1 | grep -q 'errors \[\]' || { echo "BŁĄD: $t"; exit 1; }; done
          node tests/ui_32.js mobile | tail -1 | grep -q 'errors \[\]' || { echo "BŁĄD: ui_32 mobile"; exit 1; }
          python3 tests/test_analiza.py | tail -1 | grep -q 'errors \[\]' || { echo "BŁĄD: test_analiza.py"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
